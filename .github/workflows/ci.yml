# Every push: typecheck, lint, unit tests, DB integration tests and a production build.
# A green feat/* branch is then merged into main (fast-forward only; no review needed: one developer), and
# main is deployed to the preview site on the VPS (deploy/preview/README.md). Pushes straight to main and
# manual runs with "deploy" ticked deploy too. Codex's ui/* branches aren't merged here: they go through
# review into the work branch first (CLAUDE.md). The e2e suite isn't here yet (about 22 minutes locally).
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this branch to the preview site
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # A run may be merging or deploying, so it always finishes; a newer push to the same branch waits.
  cancel-in-progress: false

permissions:
  contents: write # the merge step pushes main

jobs:
  check-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tnm
          POSTGRES_PASSWORD: tnm_dev_password
          POSTGRES_DB: tasksnearme
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tnm -d tasksnearme"
          --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      # The CI database above, with the public dev-only credentials of docker-compose.yml.
      DATABASE_URL: postgres://tnm:tnm_dev_password@localhost:5432/tasksnearme
      TEST_DATABASE_URL: postgres://tnm:tnm_dev_password@localhost:5432/tasksnearme_test
      # The tests expect the local address, as in .env.local. The build uses the preview's (PREVIEW_URL);
      # the preview's own settings live on the VPS.
      APP_URL: http://localhost:3000
      PREVIEW_URL: https://tasksnearme.com
      NEXT_TELEMETRY_DISABLED: '1'
      DEPLOY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the merge step compares this commit with main

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Throwaway secrets for this run
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Test database
        run: docker exec ${{ job.services.db.id }} psql -U tnm -d tasksnearme -c 'CREATE DATABASE tasksnearme_test'

      - name: Typecheck, lint, unit tests
        run: npm run check

      - name: DB integration tests
        run: npm run test:db

      - name: Production build (standalone)
        run: |
          npm run db:migrate
          npm run db:seed
          npm run build
        env:
          NEXT_OUTPUT: standalone
          APP_URL: ${{ env.PREVIEW_URL }}

      - name: Merge into main
        id: merge
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "main is already at ${GITHUB_SHA::7}; its own run deploys it."
          elif ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "::warning title=Not merged::main has commits that $GITHUB_REF_NAME doesn't, so it can't fast-forward. Merge by hand."
          elif git push origin "$GITHUB_SHA:refs/heads/main"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "Merged $GITHUB_REF_NAME into main at ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Not merged::main moved while this run was checking. Push again to retry."
          fi

      - name: Bundle for the preview
        if: env.DEPLOY == 'true' || steps.merge.outputs.merged == 'true'
        run: bash scripts/preview/bundle.sh preview-bundle "$GITHUB_SHA"

      - name: Deploy to the preview
        if: env.DEPLOY == 'true' || steps.merge.outputs.merged == 'true'
        env:
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/preview_deploy
          chmod 600 ~/.ssh/preview_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/preview_deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            "tnm-preview@$SSH_HOST" "deploy $GITHUB_SHA" < preview-bundle.tgz
          echo "Live: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
