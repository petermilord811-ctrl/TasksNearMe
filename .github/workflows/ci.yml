# Two kinds of run (owner, 2026-11-14: e2e only before a merge into main, quick checks on every push):
#
# - Every push: the quick checks (typecheck, lint, unit tests, DB integration tests, a production build). Nothing
#   deploys or merges. A newer push to the same branch cancels the older run, so a burst of pushes costs one run.
#   A push that changes only docs runs nothing. A ship or e2e run of the same commit stops its push run, since it runs
#   the same checks (owner, 2026-11-21: the repo is private, so Actions minutes are billed, and every ship until then
#   paid for its checks twice).
# - Ship: Actions → CI → Run workflow → pick the feat/* branch → tick "Ship", or
#     gh workflow run ci.yml --ref feat/<branch> -f deploy=true
#   The quick checks and the e2e suite (against the e2e production build, in parallel shards, each with its own
#   database) run side by side. Only when every one is green does the branch deploy to the site on the VPS
#   (deploy/preview/README.md) and, once the deploy passes its health check, fast-forward main to it. So main never
#   holds a build that failed e2e or failed to start. A push straight to main ships the same way.
#   "e2e" without "Ship" runs the suite on any branch without deploying.
#
# Codex's ui/* branches never ship from here: they go through review into the work branch first (CLAUDE.md).
name: CI

on:
  push:
    branches: ['**']
    # Docs and the root notes (CLAUDE.md, AGENTS.md) feed no check or build. A ship still runs everything.
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Ship: run the e2e suite too, then deploy this branch to tasksnearme.com and merge it into main'
        type: boolean
        default: false
      e2e:
        description: 'Run the e2e suite without shipping'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Quick-check runs on a branch give way to a newer push. Ship runs (manual, or a push to main) always finish:
  # one may be deploying or merging.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # a ship or e2e run stops the push run of the same commit
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tnm
          POSTGRES_PASSWORD: tnm_dev_password
          POSTGRES_DB: tasksnearme
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tnm -d tasksnearme"
          --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      # The CI database above, with the public dev-only credentials of docker-compose.yml.
      DATABASE_URL: postgres://tnm:tnm_dev_password@localhost:5432/tasksnearme
      TEST_DATABASE_URL: postgres://tnm:tnm_dev_password@localhost:5432/tasksnearme_test
      # The tests expect the local address, as in .env.local. The build uses the preview's (PREVIEW_URL);
      # the preview's own settings live on the VPS.
      APP_URL: http://localhost:3000
      PREVIEW_URL: https://tasksnearme.com
      SHIP: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    steps:
      # A commit is pushed and shipped in the same moment (the two runs start within 25 s of each other), so the push
      # run is still going when this step runs, after the containers start. A failed lookup or cancel only costs the
      # duplicate minutes; it never fails the ship.
      - name: Stop the push run of this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$GITHUB_SHA" \
            --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId') || true
          for id in $ids; do
            if gh run cancel "$id" --repo "$GITHUB_REPOSITORY"; then
              echo "Stopped push run $id: this run checks the same commit." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Throwaway secrets for this run
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Test database
        run: docker exec ${{ job.services.db.id }} psql -U tnm -d tasksnearme -c 'CREATE DATABASE tasksnearme_test'

      - name: Typecheck, lint, unit tests
        run: npm run check

      - name: DB integration tests
        run: npm run test:db

      - name: Production build (standalone)
        # Seeded as a fresh production database is (Gainesville open, Austin paused), so the build prerenders those pages.
        run: |
          npm run db:migrate
          npm run db:seed -- --production
          npm run build
        env:
          NEXT_OUTPUT: standalone
          APP_URL: ${{ env.PREVIEW_URL }}

      - name: Bundle for the preview
        if: env.SHIP == 'true'
        run: bash scripts/preview/bundle.sh preview-bundle "$GITHUB_SHA"

      - name: Keep the bundle for the ship job
        if: env.SHIP == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-bundle
          path: preview-bundle.tgz
          compression-level: 0 # already gzipped
          retention-days: 3
          overwrite: true # a re-run of this job replaces it

  e2e:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.deploy || inputs.e2e))
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard finishes, so one run shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: tnm
          POSTGRES_PASSWORD: tnm_dev_password
          POSTGRES_DB: tasksnearme
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tnm -d tasksnearme"
          --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      # This shard's own database: the e2e setup project reseeds it (tests/e2e/support/reset.ts).
      DATABASE_URL: postgres://tnm:tnm_dev_password@localhost:5432/tasksnearme
      # The e2e build serves http://localhost:3300 only (npm run e2e:serve, src/platform/e2e-guard.ts). PORT points
      # the specs that clear the app cache at that server.
      E2E_TARGET: build
      APP_URL: http://localhost:3300
      PORT: '3300'
      # The public dev-only values of .env.example: this build never leaves the runner.
      BETTER_AUTH_SECRET: dev-only-secret-change-me-0123456789abcdef
      FIELD_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWZvci1sb2NhbC10ZXN0aW5nISE=
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      - name: Database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: e2e build
        run: npm run e2e:build

      - name: e2e shard ${{ matrix.shard }} of 3
        run: npx playwright test --project=app-mobile --project=app-desktop --shard=${{ matrix.shard }}/3 --reporter=line,github

      # Traces are recorded on a test's retry only (playwright.config.ts), so this holds just the failed and flaky
      # tests, and a shard where every test passed first time uploads nothing. A flaky test is diagnosable from the
      # one run that caught it.
      - name: Traces of failed and flaky tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore

  ship:
    needs: [checks, e2e]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the merge step pushes main
    # One deploy at a time, whichever branch it comes from.
    concurrency:
      group: ship
      cancel-in-progress: false
    env:
      PREVIEW_URL: https://tasksnearme.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the merge check compares this commit with main

      - name: Can this merge into main?
        id: premerge
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              echo "On main: deploy only." ;;
            refs/heads/feat/*)
              git fetch --no-tags origin main
              if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
                echo "main is already at ${GITHUB_SHA::7}: deploy only."
              elif git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
                echo "merge=true" >> "$GITHUB_OUTPUT"
              else
                echo "::error title=Not shipped::main has commits that $GITHUB_REF_NAME doesn't, so it can't fast-forward. Merge main into the branch, push, and ship again."
                exit 1
              fi ;;
            *)
              echo "::error title=Not shipped::Only feat/* branches and main ship ($GITHUB_REF_NAME doesn't). Run e2e alone instead."
              exit 1 ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          name: preview-bundle

      - name: Deploy to the preview
        env:
          SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.PREVIEW_SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/preview_deploy
          chmod 600 ~/.ssh/preview_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/preview_deploy -o BatchMode=yes -o ServerAliveInterval=30 \
            "tnm-preview@$SSH_HOST" "deploy $GITHUB_SHA" < preview-bundle.tgz
          echo "Live: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      # Only after the deploy passed its health check (a failing release is rolled back on the VPS and fails
      # this run), so main always holds a build that passed e2e, started and served its pages.
      - name: Merge into main
        if: steps.premerge.outputs.merge == 'true'
        run: |
          if git push origin "$GITHUB_SHA:refs/heads/main"; then
            echo "Merged $GITHUB_REF_NAME into main at ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Not merged::main moved while this run was deploying. Ship again to retry."
          fi
